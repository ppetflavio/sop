name: Atualiza Dashboard S&OP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl numpy

      - name: Gerar data.json e products.json
        run: |
          XLSX=$(find planilha -name "*.xlsx" | head -1)
          echo "Processando: $XLSX"
          python update.py "$XLSX"

      - name: Publicar arquivos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json products.json
          git diff --staged --quiet || git commit -m "Auto: S&OP $(date +'%d/%m/%Y %H:%M')"
          git push
