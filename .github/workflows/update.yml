name: Atualiza Dashboard S&OP

on:
  push:
    paths:
      - 'planilha/*.xlsx'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas openpyxl numpy

      - name: Gerar data.json
        run: python atualizar.py

      - name: Publicar data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto: S&OP $(date +'%d/%m/%Y %H:%M')"
          git push
