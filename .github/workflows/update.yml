name: Atualiza Dashboard S&OP

on:
  push:
    paths:
      - 'planilha/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install pandas numpy

      - name: Gerar data.json e produtos.json
        run: |
          CSV=$(find planilha -name "*.csv" | sort | tail -1)
          echo "Processando: $CSV"
          python atualizar.py "$CSV"

      - name: Publicar JSONs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json produtos.json
          git diff --staged --quiet || git commit -m "Auto: S&OP $(date +'%d/%m/%Y %H:%M')"
          git push
